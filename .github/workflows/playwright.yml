name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate Cucumber/BDD tests
        run: npx bddgen

      - name: Run Playwright tests (including Cucumber scenarios)
        run: npx playwright test
        env:
          DEBUG: pw:api

      - name: Test summary
        if: always()
        run: |
          echo "## Playwright test results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/junit.xml ]; then
            PASSED=$(grep -o 'tests="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
            FAILED=$(grep -o 'failures="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
            echo "- Total tests: ${PASSED}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Failures: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No junit.xml found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit.xml
          retention-days: 30

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report/
          retention-days: 30
